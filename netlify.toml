[build]
  publish = "."
  functions = "netlify/functions"

# Normal family use makes only a handful of calls per minute. This generous
# per-IP ceiling stops runaway clients and obvious bot floods before they can
# consume an unusual amount of function, AI, or bandwidth credits.
[[redirects]]
  from = "/*"
  to = "/:splat"

  [redirects.rate_limit]
    action = "rate_limit"
    window_limit = 180
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[headers]]
  for = "/*"
  [headers.values]
    # PR #28 review branch only: the gravity-field prototype injects its CSS at runtime.
    # Keep this branch-local and revert before merge so production retains strict style-src 'self'.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"

# PR #28 is a UI prototype. Do not let a reused browser/app-shell cache hide the
# current branch JavaScript while this deploy preview is under review.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
