[build]
  publish = "."
  functions = "netlify/functions"

# Normal family use makes only a handful of calls per minute. These generous
# per-IP ceilings stop runaway clients and obvious bot floods before they can
# consume an unusual amount of function, AI, or bandwidth credits.
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"

  [redirects.rate_limit]
    action = "rate_limit"
    window_limit = 120
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/*"
  to = "/:splat"

  [redirects.rate_limit]
    action = "rate_limit"
    window_limit = 600
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; worker-src 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
